<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Patient View Demo</title>
  <style>
    /* Demo harness chrome only — not part of the patient-facing component. */
    :root {
      --accent: #27523d;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --border: #dcd6cc;
      --bg: #f4f1ec;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #demoRoot, .pv-demo {
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .pv-demo-view {
      flex: 1;
      position: relative;
      min-height: 0;
      background: #ffffff;
    }
    .pv-demo-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: #ffffff;
      font-size: 13px;
    }
    .pv-demo-bar-title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
      color: var(--muted);
    }
    .pv-demo-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .pv-demo-buttons button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafaf8;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .pv-demo-buttons button:hover { border-color: var(--accent); }
    .pv-demo-buttons button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .pv-demo-buttons .pv-demo-leave {
      background: #5b6670;
      border-color: #5b6670;
      color: #ffffff;
    }
    .pv-demo-tts {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .pv-demo-state {
      margin-left: auto;
      color: var(--muted);
      font-weight: 600;
    }
    @media (max-width: 640px) {
      .pv-demo-state { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div id="demoRoot"></div>
  <script type="module" src="./src/bootstrapDemo.jsx"></script>
</body>
</html>
